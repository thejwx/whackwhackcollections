<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Curated artwork collections by Jeff Wilson.">
  <title>Whack Whack Collections</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #d9d4ca; color: #292a26; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    main { width: min(900px, 100%); padding: clamp(32px, 7vw, 80px); background: #f9f6ee; box-shadow: 0 20px 55px rgb(36 32 26 / 18%); }
    .eyebrow { margin: 0 0 20px; color: #a25e43; font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(32px, 6vw, 56px); line-height: 1.1; letter-spacing: -.04em; }
    .intro { margin: 24px 0 0; color: #6e685f; font: 18px/1.7 Georgia, serif; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Jeff Wilson · Curated Art Collections</p>
    <h1>Whack Whack Collections</h1>
    <p class="intro">A home for curated artwork collections.</p>
  </main>
</body>
</html>
